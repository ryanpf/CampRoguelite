# Sample branching conversation exercising DialogueParser/DialogueBox
# branch support: a branch node offers a card per option, and selecting one
# continues the conversation on the corresponding branch, converging back
# onto a shared closing line via "next". The "Turn back" option is flagged
# "special: true", so it's also the option chosen automatically if the
# branch's visible timeout (see DialogueBox.branch_timeout_seconds) runs out
# before the player picks a card - its line conveys that indecision itself
# is what turned Balaam back. It also demonstrates ending the conversation
# early via the special "end" target, skipping the shared closing line
# entirely.
- id: start
  speaker: balaam
  text: "Which path shall we take?"
- branch: true
  options:
    - text: "Take the mountain pass"
      target: mountain
    - text: "Take the river road"
      target: river
    - text: "Turn back for camp"
      target: turn_back
      special: true
- id: mountain
  speaker: donkey
  text: "The mountain air is thin here."
  next: reunited
- id: river
  speaker: donkey
  text: "The river runs swift and cold."
  next: reunited
- id: turn_back
  speaker: donkey
  text: "Too indecisive to choose a path, Balaam simply turns back for camp."
  next: end
- id: reunited
  speaker: balaam
  text: "Onward, regardless of the path taken."
