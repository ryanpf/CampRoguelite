# Sample branching conversation exercising DialogueBox's branch response
# timeout: the branch node overrides the default timeout down to a fraction
# of a second (via "timeout") so tests can wait it out quickly, and flags
# the untagged "turn_back" option "timeout: true" so it is the one
# followed automatically once that timeout runs out without the player
# playing a response card.
- id: start
  speaker: balaam
  text: "Shall we charge the mountain pass, or take the easy river road?"
- branch: true
  timeout: 0.05
  options:
    - tags: easygoing
      target: river
    - tags: brash
      target: mountain
    - timeout: true
      target: turn_back
- id: mountain
  speaker: donkey
  text: "The mountain air is thin here."
  next: reunited
- id: river
  speaker: donkey
  text: "The river runs swift and cold."
  next: reunited
- id: turn_back
  speaker: donkey
  text: "Perhaps it is wiser to turn back for camp."
  next: end
- id: reunited
  speaker: balaam
  text: "Onward, regardless of the path taken."
