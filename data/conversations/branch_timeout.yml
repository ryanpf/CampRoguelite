# Sample branching conversation exercising DialogueBox's branch response
# timeout: the branch node overrides the default timeout down to a fraction
# of a second (via "timeout") so tests can wait it out quickly, and flags
# the "Turn back" option "special: true" so it is the one selected
# automatically once that timeout runs out without a player selection.
- id: start
  speaker: balaam
  text: "Which path shall we take?"
- branch: true
  timeout: 0.05
  options:
    - text: "Take the mountain pass"
      target: mountain
    - text: "Take the river road"
      target: river
    - text: "Turn back for camp"
      target: turn_back
      special: true
- id: mountain
  speaker: donkey
  text: "The mountain air is thin here."
  next: reunited
- id: river
  speaker: donkey
  text: "The river runs swift and cold."
  next: reunited
- id: turn_back
  speaker: donkey
  text: "Perhaps it is wiser to turn back for camp."
  next: end
- id: reunited
  speaker: balaam
  text: "Onward, regardless of the path taken."
