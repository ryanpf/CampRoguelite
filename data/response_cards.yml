# The player's inventory of response cards, played at a conversation's
# branch nodes (see scripts/dialogue/response_card_parser.gd). A card's
# "tags" (comma-separated, in priority order) decide which branch the
# conversation follows; its "text" should hint at them. Several cards may
# share a tag, a card may carry more than one, and a card may have none at
# all - an untagged card never matches a branch directly, so it always
# follows the branch's fallback (special) option.
- text: "Nope. Absolutely not."
  tags: timid
- text: "Um... is there an easier way?"
  tags: timid
- text: "Eh, whatever you think."
  tags: easygoing
- text: "Hold on, let's check the map first."
  tags: smart
- text: "Last one there's a rotten egg!"
  tags: brash
- text: "Bold AND clever: we cut straight over the ridge!"
  tags: brash, smart
- text: "Wait, what was the question?"
