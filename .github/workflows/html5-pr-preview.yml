name: Build HTML5 PR Preview

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  pages: write
  id-token: write

# Only one deployment at a time: GitHub Pages (Actions source) serves a
# single site, so a build from one PR would otherwise overwrite another's
# in-flight deployment.
concurrency:
  group: html5-pr-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.2.2

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Prepare export templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mkdir -v -p ~/.config/
          mv /root/.config/godot ~/.config/godot || true
          mv /root/.local/share/godot/export_templates/4.2.2.stable ~/.local/share/godot/export_templates/4.2.2.stable || true

      - name: Append GitHub SHA to build version
        id: version
        uses: ./.github/actions/append-build-version
        with:
          sha: ${{ github.event.pull_request.head.sha }}

      - name: Import project resources
        run: godot --headless --path . --import

      - name: Export HTML5 build
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/web
          godot --headless --verbose --path . --export-debug "Web" build/web/index.html 2>&1 | tee build/web/export.log

      - name: Add cross-origin isolation service worker
        shell: bash
        run: |
          cp web/coi-serviceworker.js build/web/coi-serviceworker.js

      - name: Add cache-busting query strings and no-cache mount page
        shell: bash
        env:
          BUILD_ID: ${{ github.event.pull_request.head.sha }}
          BUILD_VERSION: ${{ steps.version.outputs.version }}
          COMMIT_URL: https://github.com/${{ github.repository }}/commit/${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          BUILD_ID="${BUILD_ID::7}"
          INDEX="build/web/index.html"

          # Bust the browser cache for directly-referenced entry assets by
          # appending a build-specific query string. These are plain
          # <script src>/<link href> fetches, so a query string is safe.
          for asset in "index.js" "coi-serviceworker.js" "index.icon.png" "index.apple-touch-icon.png"; do
            sed -i -E "s#(src|href)=([\"'])${asset}\\2#\\1=\\2${asset}?v=${BUILD_ID}\\2#g" "$INDEX"
          done

          # Bust the cache for the main .pck data file via the engine's own
          # `mainPack` override, keeping the matching `fileSizes` key in sync
          # so the loading progress bar keeps working. The `.wasm`/`.worker.js`
          # files are intentionally left untouched: Godot's engine.js derives
          # their URLs by string concatenation on `executable`, and a query
          # string there would corrupt the computed path (e.g. "index?v=1.wasm").
          BUSTED_PCK="index.pck?v=${BUILD_ID}"
          sed -i "s#\"executable\":\"index\"#\"executable\":\"index\",\"mainPack\":\"${BUSTED_PCK}\"#" "$INDEX"
          sed -i "s#\"index.pck\":#\"${BUSTED_PCK}\":#" "$INDEX"

          # Disallow caching of the HTML mount page itself so returning
          # visitors always re-fetch the latest build's markup/config.
          sed -i "s#<meta charset=\"utf-8\">#<meta charset=\"utf-8\">\n\t\t<meta http-equiv=\"Cache-Control\" content=\"no-cache, no-store, must-revalidate\">\n\t\t<meta http-equiv=\"Pragma\" content=\"no-cache\">\n\t\t<meta http-equiv=\"Expires\" content=\"0\">#" "$INDEX"

          # Show the build version + short SHA directly on the mount page
          # (outside the game canvas) as a link to the exact commit it was
          # built from, so it's immediately visible (and traceable) which
          # build is loaded, even if the WASM game itself fails to start
          # or the browser is still serving a stale cached page.
          BUILD_INFO_HTML="<a id=\"build-info\" href=\"${COMMIT_URL}\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"position:fixed;bottom:4px;right:6px;font:11px monospace;color:#ccc;background:rgba(0,0,0,0.6);padding:2px 6px;border-radius:4px;z-index:9999;text-decoration:none;\">${BUILD_VERSION}</a>"
          sed -i "s@<body>@<body>\n\t\t${BUILD_INFO_HTML}@" "$INDEX"

      - name: Upload export log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CampRoguelite-html5-export-log
          path: build/web/export.log

      - name: Remove export log from Pages artifact
        run: rm -f build/web/export.log

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Every PR preview is deployed to its own pr-<number>/ subdirectory
      # (via destination_dir above), but nothing ever publishes an
      # index.html at the Pages site root, so the top-level
      # https://<owner>.github.io/<repo>/ link 404s. Generate and deploy a
      # small landing page there listing every open PR's preview so the
      # root link resolves to something useful instead of a 404.
      - name: Generate root landing page listing open PR previews
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });
            const escapeHtml = (str) => str.replace(/[&<>"']/g, (c) => (
              { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
            ));
            const items = pulls
              .sort((a, b) => b.number - a.number)
              .map((pr) => `      <li><a href="pr-${pr.number}/">PR #${pr.number}: ${escapeHtml(pr.title)}</a></li>`)
              .join('\n');
            const html = `<!DOCTYPE html>
            <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
              <meta http-equiv="Pragma" content="no-cache">
              <meta http-equiv="Expires" content="0">
              <title>CampRoguelite HTML5 Previews</title>
            </head>
            <body>
              <h1>CampRoguelite HTML5 Previews</h1>
              <p>Each open pull request gets its own HTML5 preview build:</p>
              <ul>
            ${items || '      <li>No open pull request previews right now.</li>'}
              </ul>
            </body>
            </html>
            `;
            fs.mkdirSync('build/root-page', { recursive: true });
            fs.writeFileSync('build/root-page/index.html', html);

      - name: Deploy root landing page to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/root-page
          keep_files: true

      - name: Comment preview link on PR
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const url = '${{ steps.deployment.outputs.page_url }}';
            const body = `🎮 HTML5 preview build deployed: ${url}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: context.payload.pull_request.number,
            });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes('HTML5 preview build deployed'));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: context.payload.pull_request.number, body });
            }
