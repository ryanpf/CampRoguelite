name: Build HTML5 PR Preview

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: html5-pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.2.2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare export templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mkdir -v -p ~/.config/
          mv /root/.config/godot ~/.config/godot || true
          mv /root/.local/share/godot/export_templates/4.2.2.stable ~/.local/share/godot/export_templates/4.2.2.stable || true

      - name: Export HTML5 build
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/web
          godot --headless --verbose --path . --export-debug "Web" build/web/index.html 2>&1 | tee build/web/export.log

      - name: Add cross-origin isolation service worker
        shell: bash
        run: |
          cp web/coi-serviceworker.js build/web/coi-serviceworker.js

      - name: Add cache-busting query strings and no-cache mount page
        shell: bash
        env:
          BUILD_ID: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          BUILD_ID="${BUILD_ID::7}"
          python3 - "$BUILD_ID" << 'PYEOF'
          import re
          import sys

          build_id = sys.argv[1]
          path = "build/web/index.html"
          with open(path, "r", encoding="utf-8") as f:
              html = f.read()

          # Bust the browser cache for directly-referenced entry assets by
          # appending a build-specific query string. These are plain
          # <script src>/<link href> fetches, so a query string is safe.
          for asset in ("index.js", "coi-serviceworker.js", "index.icon.png", "index.apple-touch-icon.png"):
              html = re.sub(
                  rf'(src|href)=(["\']){re.escape(asset)}\2',
                  rf'\1=\2{asset}?v={build_id}\2',
                  html,
              )

          # Bust the cache for the main .pck data file via the engine's own
          # `mainPack` override, keeping the matching `fileSizes` key in sync
          # so the loading progress bar keeps working. The `.wasm`/`.worker.js`
          # files are intentionally left untouched: Godot's engine.js derives
          # their URLs by string concatenation on `executable`, and a query
          # string there would corrupt the computed path (e.g. "index?v=1.wasm").
          busted_pck = f"index.pck?v={build_id}"
          html = html.replace('"executable":"index"', f'"executable":"index","mainPack":"{busted_pck}"')
          html = html.replace('"index.pck":', f'"{busted_pck}":')

          # Disallow caching of the HTML mount page itself so returning
          # visitors always re-fetch the latest build's markup/config.
          no_cache_meta = (
              '<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">\n'
              '\t\t<meta http-equiv="Pragma" content="no-cache">\n'
              '\t\t<meta http-equiv="Expires" content="0">'
          )
          html = html.replace('<meta charset="utf-8">', '<meta charset="utf-8">\n\t\t' + no_cache_meta, 1)

          with open(path, "w", encoding="utf-8") as f:
              f.write(html)
          PYEOF

      - name: Deploy PR preview to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
          destination_dir: pr-${{ github.event.pull_request.number }}
          keep_files: true
          exclude_assets: 'export.log'

      - name: Comment preview link on PR
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const url = `https://${owner}.github.io/${repo}/pr-${context.payload.pull_request.number}/`;
            const body = `🎮 HTML5 preview build deployed: ${url}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: context.payload.pull_request.number,
            });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes('HTML5 preview build deployed'));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: context.payload.pull_request.number, body });
            }

      - name: Upload export log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CampRoguelite-html5-export-log
          path: build/web/export.log
