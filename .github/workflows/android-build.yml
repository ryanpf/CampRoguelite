name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  export-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.2.2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare export templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mkdir -v -p ~/.config/
          mv /root/.config/godot ~/.config/godot || true
          mv /root/.local/share/godot/export_templates/4.2.2.stable ~/.local/share/godot/export_templates/4.2.2.stable || true

      - name: Configure Godot Android editor settings
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.tres <<'EOF'
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          export/android/debug_keystore = "/root/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          export/android/shutdown_adb_on_exit = true
          EOF

      - name: Install Android SDK components
        run: |
          SDKMANAGER=/usr/lib/android-sdk/cmdline-tools/cmdline-tools/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Ensure debug keystore exists
        run: |
          if [ ! -f /root/debug.keystore ]; then
            keytool -genkeypair \
              -keystore /root/debug.keystore \
              -storepass android \
              -storetype pkcs12 \
              -validity 9990 \
              -keyalg RSA \
              -alias androiddebugkey \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Append GitHub SHA to build version
        shell: bash
        run: |
          REVISION="${GITHUB_SHA::7}"
          BASE_VERSION="$(sed -n 's/^config\/version="\([^"]*\)"$/\1/p' project.godot)"
          BUILD_VERSION="${BASE_VERSION}-${REVISION}"
          sed -i "s/^config\/version=\".*\"$/config\/version=\"$BUILD_VERSION\"/" project.godot
          sed -i "s/^version\/name=\".*\"$/version\/name=\"$BUILD_VERSION\"/" export_presets.cfg

      - name: Export Android debug APK
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/android
          godot --headless --verbose --path . --export-debug "Android" build/android/CampRoguelite.apk 2>&1 | tee build/android/export.log

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CampRoguelite-android-apk
          path: build/android/CampRoguelite.apk

      - name: Upload export log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CampRoguelite-android-export-log
          path: build/android/export.log
